[advisories]
# rsa 0.9.10 is an optional (unused) transitive dependency of ssh-key.
# It is never compiled or linked. No patched version exists as of writing.
# https://rustsec.org/advisories/RUSTSEC-2023-0071
#
# RUSTSEC-2024-0437: protobuf 2.x crash due to uncontrolled recursion.
# Transitive via: pico-edge -> pingora-core 0.9.0 -> prometheus 0.13.x -> protobuf 2.x
# (when the prometheus feature is enabled). Pingora requires prometheus ^0.13
# (incompatible with 0.14.0 which uses protobuf >=3.7.2).
# protobuf is used only for internal prometheus metrics, not parsing untrusted data.
# Tracked upstream: https://github.com/stepancheg/rust-protobuf/issues/749
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0437",
    # RUSTSEC-2026-0459: libsqlite3-sys bundles SQLite < 3.54.0 (CVE-2026-119375,
    # CVSS 6.8 MEDIUM, local vector). Transitive via sqlx 0.9.0 -> sqlx-sqlite ->
    # libsqlite3-sys; sqlx-sqlite 0.9.0 caps the range at <0.38.0 while the fix
    # needs >=0.39.0, so no compatible release exists yet. Upgrade sqlx when it
    # widens the range. cargo-deny carries the same exception in deny.toml.
    "RUSTSEC-2026-0459",
]
