[package]
name = "pico-snapshot-ebpf"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "eBPF probes for dirty page tracking and I/O access pattern analysis used by the snapshot scheduler"

[features]
default = ["arch-x86_64"]
arch-x86_64 = []
arch-aarch64 = []

[[bin]]
name = "pico-snapshot-ebpf"
path = "src/main.rs"

[dependencies]
aya-ebpf = "0.2.1"

[package.metadata.cargo-udeps.ignore]
development = ["pico-snapshot-ebpf"]

[profile.dev]
opt-level = 1
debug = true
panic = "abort"

[profile.release]
opt-level = 3
debug = false
lto = true
panic = "abort"
strip = "symbols"
codegen-units = 1
