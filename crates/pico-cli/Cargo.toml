[package]
name = "pico-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
description = "CLI for managing PicoCompute sandboxes"

[[bin]]
name = "pc"
path = "src/main.rs"

[dependencies]
camino = { workspace = true }
pico-core = { workspace = true }
pico-image = { workspace = true }
pico-telemetry = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
hashbrown = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["query", "stream"] }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-util", "io-std", "net"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
