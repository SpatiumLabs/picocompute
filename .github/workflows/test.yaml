name: Test Suite

on:
  push:
    branches: [main]
    paths: &paths
      - crates/**/*.rs
      - crates/**/Cargo.toml
      - "**/Cargo.toml"
      - Cargo.lock
      - "fuzz/**/*.rs"
      - "fuzz/**/Cargo.toml"
      - "fuzz/corpus/**"
      - scripts/fuzz-seeded.sh
      - ".cargo/config.toml"
      - ".config/nextest.toml"
      - ".github/actions/**"
      - ".github/workflows/test.yaml"
      - ".github/workflows/fuzz-nightly.yaml"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: 1

jobs:
  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly, 1.98.1, stable]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
        exclude:
          # Only test nightly and 1.98.1 on x86_64 to keep CI time bounded.
          # arm64 runs stable-only.
          - arch: arm64
            toolchain: nightly
          - arch: arm64
            toolchain: 1.98.1
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo lint

      - name: Test
        run: cargo ta --profile ci

  conformance:
    name: Conformance (${{ matrix.toolchain }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Run backend conformance suite
        run: |
          # --test-threads=1 ensures serial execution so backend state
          # isolation is preserved (some backends are single-use).
          # Runs all conformance tests (unit + integration) via nextest
          # filter expression: kind(test) for integration, test(conformance) for unit.
          cargo nextest run -p pico-runtime \
            --test-threads=1 \
            -E 'kind(test) + test(conformance)' 2>&1

      - name: Print conformance summary
        if: always()
        run: |
          echo "## Backend Conformance Suite" >> $GITHUB_STEP_SUMMARY
          echo "All backends must pass the lifecycle conformance suite." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- MockBackend: included in unit tests (always passes)" >> $GITHUB_STEP_SUMMARY
          echo "- FirecrackerAdapter: requires Firecracker binary and TAP (Linux only)" >> $GITHUB_STEP_SUMMARY
          echo "- GVisorAdapter: requires runsc binary (Linux only)" >> $GITHUB_STEP_SUMMARY
          echo "- QemuAdapter: requires QEMU binary (Linux only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Real-backend conformance runs require platform-specific CI runners." >> $GITHUB_STEP_SUMMARY

  binary-restart-acceptance:
    name: Binary Restart Acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Build binaries with mock-backend feature
        run: |
          cargo build -p pico-sandboxd --features mock-backend
          cargo build -p pico-host-agent
          cargo build -p pico-guest-agent

      - name: Run binary-level restart acceptance tests
        run: |
          cargo nextest run -p pico-host-agent \
            --test binary_restart_acceptance \
            --run-ignored all \
            --no-fail-fast

  validate-o11y-dashboards:
    name: Validate Observability Dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate dashboard JSON and runbook links
        run: ./scripts/validate-o11y-dashboards.sh

  fuzz-seeded:
    name: Fuzz Seeded Corpus + Property Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run property suites
        run: |
          cargo nextest run -p pico-core --test lifecycle_property
          cargo nextest run -p pico-core --test snapshot_exclusion_property
          cargo nextest run -p pico-core --test backend_selection_property
          cargo nextest run -p pico-guest-protocol --test protocol_property
          cargo nextest run -p pico-network-agent --test policy_property
      - name: Seeded short fuzz run
        run: ./scripts/fuzz-seeded.sh --runs 500 --max-time 20
      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-seeded
          path: fuzz/artifacts/**/*
          if-no-files-found: ignore
