name: Security Audit

on:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - ".cargo/audit.toml"
      - Cargo.lock
  schedule:
    - cron: "0 2 * * 0" # Run every sunday at 2AM UTC

permissions:
  contents: read

jobs:
  security-audit:
    permissions:
      checks: write # for rustsec/audit-check to create check
      contents: read # for actions/checkout to fetch code
      issues: write # for rustsec/audit-check to create issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile --ignore-rust-version

      - name: Audit Check
        uses: rustsec/audit-check@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Vulnerability-level exceptions; keep in sync with .cargo/audit.toml.
          # RUSTSEC-2026-0459 and RUSTSEC-2026-0387 are tracked in
          # .cargo/audit.toml; passing them here keeps the check green even if
          # this action only honors its input. Comma-separated: the action
          # splits the input into one --ignore flag per ID.
          ignore: RUSTSEC-2026-0459,RUSTSEC-2026-0387
